<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Crew Schedule</title><!-- deployment trigger -->
<style>
:root{color-scheme:dark;--bg:#0b1018;--surface:#121923;--line:#334255;--muted:#91a0b3;--blue:#5aa9ff;--green:#36d18a;--red:#e56b6f;--yellow:#e4b55a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#e8eef7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
button,input,textarea{font:inherit}button{color:inherit;background:none;border:0;cursor:pointer}
.app{min-height:100vh;padding:calc(env(safe-area-inset-top) + 10px) 0 calc(env(safe-area-inset-bottom) + 12px)}
.top{display:flex;align-items:center;justify-content:space-between;padding:0 16px 8px}.title{font-size:22px;font-weight:750}.sync{font-size:12px;color:var(--muted);margin-top:2px}
.icon{font-size:25px;padding:8px}.nav{display:flex;align-items:center;padding:4px 12px}.nav .label{flex:1;font-size:17px;font-weight:650}.nav button{padding:8px;font-size:14px}.grid{padding:0 8px;overflow:auto}.week-head,.week-row{display:grid;grid-template-columns:104px repeat(5,minmax(70px,1fr))}.week-head{height:52px}.week-head>div,.week-row>div{border:.5px solid var(--line)}.week-head .blank{display:flex;align-items:center}.add{font-size:26px;padding-left:12px}.dayhead{display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:11px;font-weight:700}.dayhead span{color:#8997aa;font-weight:500;margin-top:2px}.week-row{min-height:68px}.project{padding:8px 6px;display:flex;flex-direction:column;justify-content:center;cursor:pointer;border-right:1px solid var(--line)}.project b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.project small{font-size:10px;color:#8794a8;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.cell{padding:4px;display:flex;align-items:center}.status{width:100%;height:56px;border:1px solid #2a3545;border-radius:10px;background:transparent;font-size:21px;font-weight:750}.status.yes{color:var(--green);background:#36d18a1f}.status.no{color:var(--red);background:#e56b6f1f}.status.unknown{color:var(--yellow);background:#e4b55a1f}
.menu{position:relative}.menu-panel{display:none;position:absolute;right:0;top:45px;background:#1b2634;border:1px solid var(--line);border-radius:10px;padding:5px;z-index:20;min-width:145px}.menu.open .menu-panel{display:block}.menu-panel button{display:block;width:100%;text-align:left;padding:10px;border-radius:7px}.menu-panel button:hover{background:#263447}
.calendar{padding:0 6px;overflow:auto}.cal-head,.cal-row{display:grid;grid-template-columns:repeat(5,minmax(90px,1fr))}.cal-head>div,.cal-row>div{border:.5px solid var(--line)}.cal-head{height:38px}.cal-head div{display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}.cal-row{min-height:104px}.cal-row.tall{min-height:180px}.cal-day{padding:4px}.cal-day.adj{background:#080d14}.date{text-align:center;font-size:13px;font-weight:700;color:#e8eef7}.adj .date{color:#566274}.project-card{height:42px;margin-top:3px;border:1px solid #2b7252;border-radius:6px;background:#173c2e;color:#70e5a8;display:flex;align-items:center;justify-content:center;text-align:center;font-size:10px;font-weight:650;padding:2px;cursor:pointer}
.empty{padding:24px;color:#93a1b5}.modal-bg{display:none;position:fixed;inset:0;background:#0009;align-items:center;justify-content:center;padding:20px;z-index:50}.modal-bg.show{display:flex}.modal{width:min(460px,100%);background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px}.modal h2{margin:0 0 14px;font-size:19px}.modal input,.modal textarea{width:100%;background:#0b1018;border:1px solid #3b4a5f;color:#e8eef7;border-radius:8px;padding:10px;margin-bottom:10px}.modal textarea{min-height:80px;resize:vertical}.actions{display:flex;justify-content:flex-end;gap:8px}.actions button{padding:9px 13px;border-radius:8px}.primary{background:#245d96}.danger{color:var(--red)}
@media(max-width:600px){.week-head,.week-row{grid-template-columns:88px repeat(5,minmax(62px,1fr))}.grid,.calendar{overflow-x:auto}.week-head,.week-row,.cal-head,.cal-row{min-width:500px}}
</style>
</head>
<body><main class="app">
<header class="top"><div><div class="title">Crew Schedule</div><div id="sync" class="sync">● Syncing…</div></div>
<div class="menu" id="menu"><button class="icon" id="modeBtn" aria-label="Mode">▦</button><div class="menu-panel"><button data-mode="week">Week Mode</button><button data-mode="calendar">Calendar Mode</button></div></div></header>
<div class="nav"><button id="prev">‹</button><div id="navLabel" class="label"></div><button id="next">›</button><button id="today">Today</button></div>
<section id="content"></section>
</main>
<div class="modal-bg" id="modalBg"><div class="modal"><h2 id="modalTitle"></h2><input id="name" placeholder="Project"><textarea id="desc" placeholder="Description (optional)"></textarea><div class="actions"><button id="delete" class="danger">Delete</button><button id="cancel">Cancel</button><button id="save" class="primary">Save</button></div></div></div>
<script>
const SUPABASE_URL="__SUPABASE_URL__";
const SUPABASE_KEY="__SUPABASE_KEY__";
const SCHEDULE_ID="crew-schedule-shared";
const KEY="crew-schedule-local";
const YES="yes",NO="no",UNKNOWN="unknown";
let state=JSON.parse(localStorage.getItem(KEY)||'{"projects":[],"statuses":{}}'),mode="week";
let monday=getMonday(new Date()),month=new Date(new Date().getFullYear(),new Date().getMonth(),1),editing=null,refreshing=false;
const $=id=>document.getElementById(id);
function getMonday(d){d=new Date(d);let n=(d.getDay()+6)%7;d.setDate(d.getDate()-n);d.setHours(0,0,0,0);return d}
function key(d){return d.toISOString().slice(0,10)}
function saveLocal(){localStorage.setItem(KEY,JSON.stringify(state))}
function fmt(d,o){return new Intl.DateTimeFormat("en-US",o).format(d)}
function setSync(s){$("sync").textContent=s}
async function api(method,body){let u=SUPABASE_URL.replace(/\/$/,"")+"/rest/v1/crew_schedule";if(method==="GET")u+="?id=eq."+encodeURIComponent(SCHEDULE_ID)+"&select=payload,updated_at";else u+="?on_conflict=id";let r=await fetch(u,{method,headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY,"Content-Type":"application/json",Prefer:"resolution=merge-duplicates,return=minimal"},body:method==="GET"?undefined:JSON.stringify(body)});let t=await r.text();if(!r.ok)throw new Error("HTTP "+r.status+(t?": "+t:""));return t?JSON.parse(t):null}
async function pull(){if(!SUPABASE_KEY){setSync("● Local only");return}setSync("↻ Syncing…");try{let rows=await api("GET");if(rows.length){state=rows[0].payload;saveLocal()}setSync("● Synced · "+fmt(new Date(),{hour:"numeric",minute:"2-digit"}))}catch(e){setSync("● Sync error · "+e.message)}render()}
async function push(){saveLocal();if(!SUPABASE_KEY){setSync("● Local only");return}setSync("↻ Syncing…");try{await api("POST",{id:SCHEDULE_ID,payload:state,updated_at:new Date().toISOString()});setSync("● Synced · "+fmt(new Date(),{hour:"numeric",minute:"2-digit"}))}catch(e){setSync("● Sync error · "+e.message)}}
function setStatus(pid,d,s){state.statuses[pid]??={};state.statuses[pid][key(d)]=s;push();render()}
function projectDialog(p){editing=p||{id:crypto.randomUUID(),name:"",description:""};$("modalTitle").textContent=p?"Edit Project":"Add Project";$("name").value=editing.name;$("desc").value=editing.description;$("delete").style.display=p?"block":"none";$("modalBg").classList.add("show");$("name").focus()}
$("cancel").onclick=()=>{$("modalBg").classList.remove("show");editing=null}
$("save").onclick=()=>{let name=$("name").value.trim();if(!name)return;let p={...editing,name,description:$("desc").value.trim()};let found=state.projects.some(x=>x.id===p.id);state.projects=found?state.projects.map(x=>x.id===p.id?p:x):[...state.projects,p];state.projects.sort((a,b)=>a.name.localeCompare(b.name));$("modalBg").classList.remove("show");editing=null;push();render()}
$("delete").onclick=()=>{if(!editing||!confirm("Delete this project? This removes its schedule information too."))return;state.projects=state.projects.filter(p=>p.id!==editing.id);delete state.statuses[editing.id];$("modalBg").classList.remove("show");editing=null;push();render()}
function statusButton(p,d){let s=state.statuses[p.id]?.[key(d)]||UNKNOWN;let b=document.createElement("button");b.className="status "+s;b.textContent=s===YES?"✓":s===NO?"X":"?";b.onclick=()=>{let n=s===YES?NO:s===NO?UNKNOWN:YES;setStatus(p.id,d,n)};return b}
function renderWeek(){let c=document.createElement("div");c.className="grid";let h=document.createElement("div");h.className="week-head";let blank=document.createElement("div");blank.className="blank";let add=document.createElement("button");add.className="add";add.textContent="+";add.onclick=()=>projectDialog();blank.append(add);h.append(blank);for(let i=0;i<5;i++){let d=new Date(monday);d.setDate(d.getDate()+i);let x=document.createElement("div");x.className="dayhead";x.innerHTML=fmt(d,{weekday:"short"}).toUpperCase()+"<span>"+d.getDate()+"</span>";h.append(x)}c.append(h);if(!state.projects.length){let e=document.createElement("div");e.className="empty";e.textContent="Add your first project with +";c.append(e)}state.projects.forEach(p=>{let r=document.createElement("div");r.className="week-row";let pr=document.createElement("div");pr.className="project";pr.innerHTML="<b>"+esc(p.name)+"</b>"+(p.description?"<small>"+esc(p.description)+"</small>":"");pr.onclick=()=>projectDialog(p);r.append(pr);for(let i=0;i<5;i++){let d=new Date(monday);d.setDate(d.getDate()+i);let cell=document.createElement("div");cell.className="cell";cell.append(statusButton(p,d));r.append(cell)}c.append(r)});return c}
function renderCalendar(){let c=document.createElement("div");c.className="calendar";let h=document.createElement("div");h.className="cal-head";["MON","TUE","WED","THU","FRI"].forEach(x=>{let d=document.createElement("div");d.textContent=x;h.append(d)});c.append(h);let first=new Date(month),last=new Date(month.getFullYear(),month.getMonth()+1,0),fm=getMonday(first);let lm=getMonday(last);for(let w=new Date(fm);w<=lm;w.setDate(w.getDate()+7)){let days=[],max=0;for(let i=0;i<5;i++){let d=new Date(w);d.setDate(d.getDate()+i);let ps=state.projects.filter(p=>state.statuses[p.id]?.[key(d)]===YES);days.push({d,ps});max=Math.max(max,ps.length)}let r=document.createElement("div");r.className="cal-row"+(max>1?" tall":"");days.forEach(({d,ps})=>{let x=document.createElement("div");x.className="cal-day"+(d.getMonth()!==month.getMonth()?" adj":"");let date=document.createElement("div");date.className="date";date.textContent=d.getDate();x.append(date);ps.forEach(p=>{let card=document.createElement("div");card.className="project-card";card.textContent=p.name;card.onclick=()=>projectDialog(p);x.append(card)});r.append(x)});c.append(r)}return c}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function render(){ $("content").replaceChildren();if(mode==="week"){$("navLabel").textContent=fmt(monday,{month:"short",day:"numeric",year:"numeric"}).replace(/, /,"–")+"–"+fmt(new Date(monday.getTime()+4*86400000),{day:"numeric",year:"numeric"});$("content").append(renderWeek());$("modeBtn").textContent="▦"}else{$("navLabel").textContent=fmt(month,{month:"long",year:"numeric"});$("content").append(renderCalendar());$("modeBtn").textContent="▦"}}
$("modeBtn").onclick=()=>$("menu").classList.toggle("open");document.querySelectorAll("[data-mode]").forEach(b=>b.onclick=()=>{mode=b.dataset.mode;$("menu").classList.remove("open");render()});
$("prev").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()-7);else month.setMonth(month.getMonth()-1);render()};
$("next").onclick=()=>{if(mode==="week")monday.setDate(monday.getDate()+7);else month.setMonth(month.getMonth()+1);render()};
$("today").onclick=()=>{if(mode==="week")monday=getMonday(new Date());else month=new Date(new Date().getFullYear(),new Date().getMonth(),1);render()};
document.addEventListener("click",e=>{if(!e.target.closest(".menu"))$("menu").classList.remove("open")});
render();pull();setInterval(pull,15000);
</script></body></html>
